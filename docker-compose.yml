# Production-like local stack: PostgreSQL + FastAPI + Next.js.
# Secrets must be provided via environment (e.g. an .env file next to this compose file).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: applier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: applier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applier"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      APPLIER_ENVIRONMENT: production
      APPLIER_DATABASE_URL: postgresql+psycopg://applier:${POSTGRES_PASSWORD}@db:5432/applier
      APPLIER_SECRET_KEY: ${APPLIER_SECRET_KEY:?set APPLIER_SECRET_KEY}
      APPLIER_ENCRYPTION_KEY: ${APPLIER_ENCRYPTION_KEY:?set APPLIER_ENCRYPTION_KEY}
      APPLIER_COOKIE_SECURE: ${APPLIER_COOKIE_SECURE:-true}
      APPLIER_FRONTEND_URL: ${APPLIER_FRONTEND_URL:-http://localhost:3000}
      APPLIER_DEMO_MODE: ${APPLIER_DEMO_MODE:-true}
      APPLIER_ANTHROPIC_API_KEY: ${APPLIER_ANTHROPIC_API_KEY:-}
    volumes:
      - documents:/app/data
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  documents:
